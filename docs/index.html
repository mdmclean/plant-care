<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
  <title>Plant Care</title>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#064e3b" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#053a2b" media="(prefers-color-scheme: dark)">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Plant Care">
  <link rel="apple-touch-icon" href="icon-192.png">
  <style>
    :root {
      color-scheme: light dark;
      --bg: #eef1ef; --surface: #ffffff; --surface-2: #f3f5f4;
      --border: #e4e8e6;
      --shadow: 0 1px 2px rgba(16,24,20,.05), 0 6px 16px rgba(16,24,20,.06);
      --shadow-up: 0 -1px 16px rgba(16,24,20,.07);
      --text: #111714; --text-2: #5d6a64; --text-3: #aeb6b1;
      --accent: #059669; --accent-press: #047857; --on-accent: #ffffff;
      --accent-shadow: 0 6px 18px rgba(5,150,105,.32);
      --header-bg: linear-gradient(135deg, #064e3b 0%, #0a7d59 100%);
      --warn: #f59e0b; --warn-bg: #fff3df; --warn-text: #8a3a05;
      --info: #3b82f6; --info-bg: #e7eeff; --info-text: #1d4ed8;
      --ok: #10b981; --ok-bg: #e1f6ee; --ok-text: #047857;
      --ok-solid: #059669; --info-solid: #2563eb;
      --paused: #9aa7a1; --paused-bg: #eef1ef; --paused-text: #6b766f;
      --danger: #ef4444; --danger-bg: #fce8ea; --danger-text: #be123c;
      --note-bg: #fff8e6; --note-border: #f59e0b; --note-text: #7a5e16;
      --toast-bg: #16201c; --toast-text: #f2f5f3;
      --radius: 16px; --radius-sm: 12px; --radius-pill: 999px;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #0c100e; --surface: #161d19; --surface-2: #1e2622;
        --border: rgba(255,255,255,.09);
        --shadow: 0 1px 2px rgba(0,0,0,.5), 0 8px 20px rgba(0,0,0,.4);
        --shadow-up: 0 -2px 18px rgba(0,0,0,.45);
        --text: #e9efec; --text-2: #93a29b; --text-3: #5e6a64;
        --accent: #10b981; --accent-press: #0c9a6c; --on-accent: #04130d;
        --accent-shadow: 0 6px 20px rgba(16,185,129,.28);
        --header-bg: linear-gradient(135deg, #053a2b 0%, #066a4b 100%);
        --warn: #fbbf24; --warn-bg: rgba(251,191,36,.14); --warn-text: #fcd34d;
        --info: #60a5fa; --info-bg: rgba(96,165,250,.15); --info-text: #93c5fd;
        --ok: #34d399; --ok-bg: rgba(52,211,153,.15); --ok-text: #6ee7b7;
        --ok-solid: #047857; --info-solid: #1d4ed8;
        --paused: #6b766f; --paused-bg: rgba(255,255,255,.05); --paused-text: #9aa7a1;
        --danger: #f87171; --danger-bg: rgba(248,113,113,.15); --danger-text: #fca5a5;
        --note-bg: rgba(251,191,36,.1); --note-border: #fbbf24; --note-text: #e6d6a8;
        --toast-bg: #eef1ef; --toast-text: #15201c;
      }
    }
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    .hidden { display: none !important; }

    /* ── Inline Lucide icons ── */
    /* Icons scale with the surrounding font-size (1em) and inherit text color
       via currentColor, so they slot in wherever an emoji used to sit. */
    .ic { width: 1em; height: 1em; display: inline-block; vertical-align: -.14em;
           stroke: currentColor; fill: none; flex: none; }
    .hdr-title .ic { vertical-align: -.16em; margin-right: .15rem; }
    .sec-label { display: flex; align-items: center; gap: .35rem; }
    .sec-label .ic { width: 1.05em; height: 1.05em; }
    .row-avatar > .ic { width: 22px; height: 22px; color: var(--text-3); }
    .need-chip .ic { width: .95em; height: .95em; }
    .chevron { display: flex; align-items: center; }
    .chk .ic, .d-chk .ic { width: 1.25em; height: 1.25em; }
    .back-btn { display: inline-flex; align-items: center; gap: .3rem; }
    .nav-btn { display: inline-flex; align-items: center; justify-content: center; }
    .nav-btn .ic { width: 1.2em; height: 1.2em; }
    .copy-btn, .d-chk { display: inline-flex; align-items: center; justify-content: center; gap: .4rem; }
    .badge .ic, .d-loc .ic, .row-loc .ic, .bar-count .ic { vertical-align: -.15em; }
    html, body { height: 100%; overflow: hidden; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Inter', sans-serif;
            background: var(--bg); color: var(--text);
            -webkit-font-smoothing: antialiased; text-rendering: optimizeLegibility; }

    /* ── Views ── */
    .view { position: fixed; inset: 0; display: flex; flex-direction: column; }

    /* ── Header ── */
    .hdr { background: var(--header-bg); color: #fff;
            display: flex; align-items: center; gap: .65rem;
            padding: calc(.95rem + env(safe-area-inset-top)) 1.1rem .95rem;
            flex-shrink: 0; position: relative; z-index: 2; }
    .hdr-title { flex: 1; font-size: 1.15rem; font-weight: 800; min-width: 0;
                  letter-spacing: -.02em;
                  white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .hdr-sub { font-size: .68rem; font-weight: 700; letter-spacing: .06em;
                text-transform: uppercase; white-space: nowrap;
                background: rgba(255,255,255,.18); color: #fff;
                padding: .3rem .6rem; border-radius: var(--radius-pill); }
    .back-btn { background: rgba(255,255,255,.16); border: none; color: #fff;
                 border-radius: 10px; padding: .42rem .8rem; font-size: .85rem;
                 font-weight: 600; cursor: pointer; flex-shrink: 0; }
    .back-btn:active { background: rgba(255,255,255,.32); }
    .icon-btn { padding: .42rem .58rem; line-height: 1; }

    /* ── List ── */
    #list-scroll { flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch;
                    padding-bottom: .4rem; }
    .sec-label { font-size: .7rem; font-weight: 800; letter-spacing: .09em;
                  text-transform: uppercase; color: var(--text-2);
                  padding: 1.1rem 1.15rem .4rem; }
    .sec-label.warn { color: var(--warn-text); }
    .row { position: relative; display: flex; align-items: center; gap: .6rem;
            background: var(--surface); border: 1px solid var(--border);
            margin: .45rem .8rem; border-radius: var(--radius);
            padding: .9rem .8rem; cursor: pointer; box-shadow: var(--shadow);
            transition: transform .12s ease, background .12s ease; }
    .row:active { transform: scale(.988); background: var(--surface-2); }
    .row.urgent::before { content: ''; position: absolute; left: 0; top: 13px; bottom: 13px;
                           width: 4px; border-radius: 0 4px 4px 0; background: var(--warn); }
    /* Small uniform thumbnail docked at the far left. A leaf icon sits behind
       as the placeholder; the photo covers it when loaded and removes itself on
       error, falling back to the leaf. Sized to keep the row compact. */
    .row-avatar { position: relative; width: 40px; height: 40px; flex-shrink: 0;
                   border-radius: 11px; overflow: hidden; display: flex;
                   align-items: center; justify-content: center; font-size: 1.2rem;
                   background: var(--surface-2); border: 1px solid var(--border); }
    .row-avatar img { position: absolute; inset: 0; width: 100%; height: 100%;
                       object-fit: cover; }
    /* Cutout thumbnails are transparent: let the card color show through and
       give the plant a little breathing room rather than cropping to the edge. */
    .row-avatar.cut img { inset: 3px; width: calc(100% - 6px); height: calc(100% - 6px);
                           object-fit: contain; }
    .row-info { flex: 1; min-width: 0; }
    .row-name { font-weight: 700; font-size: .96rem; letter-spacing: -.01em;
                 white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .row-loc { font-size: .76rem; color: var(--text-2); margin-top: .2rem;
                white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .row-needs { display: flex; flex-wrap: wrap; gap: .3rem; margin-top: .4rem; }
    .need-chip { font-size: .7rem; font-weight: 700; letter-spacing: -.01em;
                  padding: .16rem .5rem; border-radius: var(--radius-sm);
                  display: inline-flex; align-items: center; gap: .25rem;
                  border: 1px solid transparent; max-width: 100%; }
    .need-chip.water,
    .need-chip.fert    { background: var(--warn-bg);   color: var(--warn-text);   border-color: var(--warn); }
    .need-chip.unknown { background: var(--danger-bg); color: var(--danger-text); border-color: var(--danger); }
    .need-chip.soon    { background: var(--paused-bg); color: var(--paused-text); border-color: var(--border); }
    .row-dots { display: flex; gap: .25rem; flex-shrink: 0; }
    .chevron { color: var(--text-3); font-size: 1.05rem; flex-shrink: 0; margin-left: 0; }

    /* ── Detail ── */
    #detail-scroll { flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch;
                      padding: 1.1rem .9rem 6rem; }
    .d-name { font-size: 1.2rem; font-weight: 800; color: var(--text);
               margin-bottom: .3rem; letter-spacing: -.02em; line-height: 1.2; }
    .d-loc { font-size: .82rem; color: var(--text-2); margin-bottom: 1rem; }
    .badge { padding: .5rem .75rem; border-radius: var(--radius-sm); margin: .35rem 0;
              font-size: .85rem; line-height: 1.4; font-weight: 500; border-left: 3px solid; }
    .badge.check   { background: var(--warn-bg);   color: var(--warn-text);   border-color: var(--warn); }
    .badge.due     { background: var(--info-bg);   color: var(--info-text);   border-color: var(--info); }
    .badge.pending { background: var(--paused-bg); color: var(--paused-text); border-color: var(--paused); }
    .badge.ok      { background: var(--ok-bg);     color: var(--ok-text);     border-color: var(--ok); }
    .badge.paused  { background: var(--paused-bg); color: var(--paused-text); border-color: var(--paused); }
    .badge.unknown { background: var(--danger-bg); color: var(--danger-text); border-color: var(--danger); }
    .notes { margin-top: 1rem; padding: .85rem .9rem; background: var(--note-bg);
              border-radius: var(--radius-sm); border-left: 3px solid var(--note-border);
              font-size: .82rem; color: var(--note-text); }
    .notes strong { color: var(--text); }
    .notes ul { margin-left: 1.1rem; margin-top: .5rem; }
    .notes li { margin: .55rem 0; line-height: 1.6; }

    /* ── Detail nav bar ── */
    .d-nav { position: fixed; bottom: 0; left: 0; right: 0; display: flex;
              align-items: center; gap: .75rem; background: var(--surface);
              border-top: 1px solid var(--border);
              padding: .7rem 1rem calc(.7rem + env(safe-area-inset-bottom));
              box-shadow: var(--shadow-up); }
    .nav-btn { background: var(--surface-2); border: 1px solid var(--border);
                color: var(--text); border-radius: var(--radius-sm);
                padding: .55rem 1.1rem; font-size: 1rem; font-weight: 700;
                cursor: pointer; flex-shrink: 0; }
    .nav-btn:active { background: var(--bg); }
    .nav-btn:disabled { opacity: .3; pointer-events: none; }
    .nav-hint { flex: 1; font-size: .73rem; color: var(--text-2); text-align: center;
                 overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

    /* ── Plant photo gallery ── */
    .gallery { position: relative; margin-bottom: 1rem; }
    .gallery-track { display: flex; overflow-x: auto; scroll-snap-type: x mandatory;
                      -webkit-overflow-scrolling: touch; border-radius: var(--radius);
                      border: 1px solid var(--border); background: var(--surface-2);
                      scrollbar-width: none; }
    .gallery-track::-webkit-scrollbar { display: none; }
    .slide { position: relative; flex: 0 0 100%; scroll-snap-align: center; }
    .plant-photo { width: 100%; height: 260px; object-fit: cover; display: block;
                    background: var(--surface-2); }
    .photo-date { position: absolute; right: .55rem; bottom: .55rem;
                   background: rgba(0,0,0,.58); color: #fff; font-size: .72rem; font-weight: 700;
                   padding: .26rem .58rem; border-radius: var(--radius-pill);
                   letter-spacing: .02em; }
    .g-nav { position: absolute; top: 50%; transform: translateY(-50%);
              width: 34px; height: 34px; border-radius: 50%; border: none;
              background: rgba(0,0,0,.42); color: #fff; font-size: 1.4rem; line-height: 1;
              cursor: pointer; display: flex; align-items: center; justify-content: center;
              padding-bottom: 3px; }
    .g-prev { left: .5rem; }
    .g-next { right: .5rem; }
    .g-nav:active { background: rgba(0,0,0,.72); }
    .g-nav:disabled { opacity: 0; pointer-events: none; }
    .g-dots { position: absolute; left: 0; right: 0; bottom: .5rem; display: flex;
               justify-content: center; gap: .32rem; }
    .g-dot { width: 6px; height: 6px; border-radius: 50%; background: rgba(255,255,255,.55);
              cursor: pointer; transition: background .15s, width .15s, height .15s; }
    .g-dot.active { background: #fff; width: 7px; height: 7px; }
    /* A small "maximize" affordance on each slide; the photo itself is also
       tappable. Both open the full-screen zoomable viewer. */
    .plant-photo { cursor: zoom-in; }
    .g-zoom { position: absolute; top: .5rem; right: .5rem; width: 32px; height: 32px;
               border-radius: 50%; border: none; background: rgba(0,0,0,.42); color: #fff;
               font-size: 1rem; line-height: 1; cursor: pointer; display: flex;
               align-items: center; justify-content: center; }
    .g-zoom:active { background: rgba(0,0,0,.72); }

    /* ── Full-screen photo viewer (lightbox) ── */
    .lightbox { position: fixed; inset: 0; z-index: 100; background: rgba(0,0,0,.94);
                 opacity: 0; pointer-events: none; transition: opacity .2s ease;
                 overflow: hidden; touch-action: none; overscroll-behavior: contain; }
    .lightbox.show { opacity: 1; pointer-events: auto; }
    .lightbox img { position: absolute; inset: 0; width: 100%; height: 100%;
                     object-fit: contain; transform-origin: 0 0; will-change: transform;
                     user-select: none; -webkit-user-drag: none; }
    .lb-close { position: fixed; top: calc(.55rem + env(safe-area-inset-top)); right: .7rem;
                 width: 42px; height: 42px; border-radius: 50%; border: none; z-index: 101;
                 background: rgba(255,255,255,.18); color: #fff; font-size: 1.25rem;
                 cursor: pointer; display: flex; align-items: center; justify-content: center; }
    .lb-close:active { background: rgba(255,255,255,.34); }
    .lb-hint { position: fixed; left: 50%; transform: translateX(-50%); z-index: 101;
                bottom: calc(1rem + env(safe-area-inset-bottom)); pointer-events: none;
                color: rgba(255,255,255,.72); font-size: .76rem; font-weight: 600;
                background: rgba(0,0,0,.4); padding: .35rem .8rem; border-radius: var(--radius-pill);
                transition: opacity .3s ease; }

    /* ── Check-off toggles (list rows) ── */
    .chk { width: 40px; height: 40px; border-radius: 50%; flex-shrink: 0;
            border: 1.5px solid var(--border); background: var(--surface-2); font-size: 1rem;
            display: flex; align-items: center; justify-content: center;
            cursor: pointer; opacity: .5; filter: grayscale(1);
            transition: opacity .15s, filter .15s, box-shadow .15s, background .15s, transform .1s; }
    .chk:active { transform: scale(.9); }
    /* A button this plant needs today: orange, drawing the eye. */
    .chk.need { opacity: 1; filter: none; background: var(--warn-bg); color: var(--warn-text);
                 border-color: var(--warn); box-shadow: inset 0 0 0 1.5px var(--warn); }
    /* Checked off as done (watered / fertilized): green. */
    .chk.done { opacity: 1; filter: none; background: var(--ok-bg); color: var(--ok-text);
                 border-color: var(--ok); box-shadow: inset 0 0 0 2px var(--ok); }
    /* Soil checked but still wet: a neutral "snoozed/delayed" state, not a
       completion — gray so it reads differently from the green done states. */
    .chk.snooze { opacity: 1; filter: none; background: var(--paused-bg); color: var(--paused-text);
                   border-color: var(--paused); box-shadow: inset 0 0 0 2px var(--paused); }
    /* Feed is overdue but waiting on the next watering — informational, not an
       attention item. A calm blue highlight on the sprout button carries that
       data in the "All good" section without a layout-disrupting chip (and reads
       distinctly from the orange "needs attention" state). */
    .chk.pending { opacity: 1; filter: none; background: var(--info-bg); color: var(--info-text);
                    border-color: var(--info); box-shadow: inset 0 0 0 1.5px var(--info); }

    /* ── Action bar (list view) ── */
    .action-bar { flex-shrink: 0; display: flex; align-items: center; gap: .75rem;
                   background: var(--surface); border-top: 1px solid var(--border);
                   padding: .7rem 1rem calc(.7rem + env(safe-area-inset-bottom));
                   box-shadow: var(--shadow-up); }
    .bar-count { flex: 1; font-size: .8rem; font-weight: 500; color: var(--text-2);
                  overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .clear-btn { background: none; border: none; color: var(--text-2);
                  font-size: .8rem; cursor: pointer; flex-shrink: 0; padding: .3rem .2rem; }
    .clear-btn:active { color: var(--text); }
    .copy-btn { background: var(--accent); color: var(--on-accent); border: none;
                 border-radius: var(--radius-sm); padding: .62rem 1.2rem; font-size: .9rem;
                 font-weight: 800; letter-spacing: -.01em; cursor: pointer; flex-shrink: 0;
                 box-shadow: var(--accent-shadow); transition: transform .1s ease; }
    .copy-btn:disabled { opacity: .4; box-shadow: none; pointer-events: none; }
    .copy-btn:active { transform: scale(.96); background: var(--accent-press); }

    /* ── Detail check-off buttons ── */
    .d-actions { display: flex; flex-wrap: wrap; gap: .55rem; margin-top: 1.1rem; }
    .d-chk { flex: 1 1 30%; min-width: 96px; padding: .75rem .5rem; border-radius: var(--radius-sm);
              cursor: pointer; border: 1.5px solid var(--border); background: var(--surface-2);
              color: var(--text); font-size: .82rem; font-weight: 700; transition: transform .1s ease; }
    .d-chk:active { transform: scale(.96); }
    .d-chk.need { background: var(--warn); color: #fff; border-color: var(--warn); }
    .d-chk.done { background: var(--ok-solid); color: #fff; border-color: var(--ok-solid); }
    .d-chk.snooze { background: var(--paused); color: #fff; border-color: var(--paused); }

    /* ── Toast ── */
    .toast { position: fixed; left: 50%; bottom: 5.5rem; z-index: 50;
              transform: translateX(-50%) translateY(20px);
              background: var(--toast-bg); color: var(--toast-text);
              padding: .75rem 1.2rem; border-radius: var(--radius-pill);
              font-size: .85rem; font-weight: 600; max-width: 80%;
              box-shadow: 0 8px 24px rgba(0,0,0,.25);
              opacity: 0; pointer-events: none; transition: opacity .25s, transform .25s; }
    .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

    /* ── Slide animation ── */
    @keyframes fromRight { from { opacity:0; transform:translateX(36px) } to { opacity:1; transform:translateX(0) } }
    @keyframes fromLeft  { from { opacity:0; transform:translateX(-36px) } to { opacity:1; transform:translateX(0) } }
    .from-right { animation: fromRight .22s ease-out; }
    .from-left  { animation: fromLeft  .22s ease-out; }

    /* ── Wide screens (desktop browser) ── */
    /* The single-column list reads as a thin ribbon on a wide window, so here
       we flow the cards into a responsive multi-column tile grid. The section
       labels span the full width; each .row becomes a tile (it's already a
       self-contained card). Mobile keeps the stacked list above. */
    @media (min-width: 720px) {
      #list-scroll { display: grid; align-content: start; align-items: start;
                      grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
                      gap: .8rem; padding: 1.2rem 1.4rem calc(1.2rem + .4rem);
                      max-width: 1200px; margin: 0 auto; width: 100%; }
      .sec-label { grid-column: 1 / -1; padding: .9rem .2rem .1rem; }
      .row { margin: 0; }

      #detail-scroll { padding: 1.6rem 1.6rem 6rem; }
      .d-body { display: flex; align-items: flex-start; gap: 1.8rem;
                 max-width: 1100px; margin: 0 auto; }
      .gallery { flex: 0 0 48%; max-width: 480px; margin-bottom: 0;
                  position: sticky; top: 0; }
      .plant-photo { height: auto; max-height: 78vh; object-fit: contain; }
      .d-content { flex: 1 1 0; min-width: 0; }
    }
  </style>
</head>
<body>

<!-- List view -->
<div class="view" id="list-view">
  <div class="hdr">
    <span class="hdr-title"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M11 20A7 7 0 0 1 9.8 6.1C15.5 5 17 4.48 19 2c1 2 2 4.18 2 8 0 5.5-4.78 10-10 10Z"/><path d="M2 21c0-3 1.85-5.36 5.08-6C9.5 14.52 12 13 13 12"/></svg> Plant Care</span>
    <span class="hdr-sub">Jun 24</span>
  </div>

<script>
const P = [{"id": "kalanchoe", "name": "Kalanchoe (Flaming Katy)", "nickname": "", "location": "Big Room, West-facing window", "photos": [{"src": "images/kalanchoe-2026-06-16.jpeg", "date": "2026-06-16", "label": "Jun 16, 2026"}], "thumb": "images/kalanchoe-2026-06-16-thumb.png", "waterStatus": "check", "waterMsg": "Soil check due \u2014 last watered 15d ago (interval: 14d). Check if fully dry before watering.", "fertStatus": "due", "fertMsg": "Due now \u2014 feed with today's watering (half-strength; last: 32d ago)", "notes": ["Bloom finished (as of 2026-06-16): the spring flush of orange/yellow flowers has fully faded and the plant is now in its leafy growth stage.", "Deadheading: As flower clusters fade and brown, snip the flower stems off just above the leaf line with clean scissors. Keeps the plant tidy and encourages remaining buds to open.", "Reblooming: Once all flowers fade, the plant enters a leafy growth stage. To rebloom next year, give it a 6-week autumn rest period (around September\u2013October) with 14 hours of complete uninterrupted darkness each night and only 10 hours of bright light per day. Combine with very minimal watering. Resume normal care after 6 weeks and buds will form within a few weeks.", "Photo check (2026-06-16): Foliage looks excellent \u2014 lush, dense, and bushy with thick, glossy, deep-green scalloped leaves and no spotting, yellowing, or soft stems. The blooms are completely spent now, so it has shifted into leafy growth; cut any remaining spent flower stems back by about a third to encourage bushiness. A few central shoots are reaching up toward the lamp/light, a mild hint of stretching \u2014 keep it in bright light to stay compact. Now potted in a fluted light-blue ceramic pot; make sure that pot drains and never let it sit in water, since rot is this plant's biggest risk. Mark your calendar for the September\u2013October short-day rest to trigger next year's rebloom."], "hasAction": true}, {"id": "anthurium", "name": "Anthurium (Flamingo Flower)", "nickname": "Flamingo", "location": "Big Room (upstairs), West-facing window", "photos": [{"src": "images/anthurium-2026-06-15.jpeg", "date": "2026-06-15", "label": "Jun 15, 2026"}], "thumb": null, "waterStatus": "check", "waterMsg": "Soil check due \u2014 last watered 8d ago (interval: 7d). Check if fully dry before watering.", "fertStatus": "due", "fertMsg": "Due now \u2014 feed with today's watering (half-strength; last: 32d ago)", "notes": ["TLC Needed: Currently showing leggy stems and some dried foliage. Pruning crispy brown leaves at the stem base, moving to a brighter spot, and consistent humidity will help it recover.", "Grooming: Use clean sharp scissors to snip completely dead or brown leaves right at the base of the stem \u2014 keeps the plant tidy and stops it wasting energy on dying foliage.", "Blooms: The colorful 'petals' are modified leaves called spathes, not true flowers. The actual flowers are the tiny bumps on the central spike (spadix).", "Photo check (2026-06-15): Leaves are glossy, deep green, and heart-shaped with a healthy sheen \u2014 overall in good shape. A couple of leaves show small brown spots/dried edges; snip those crispy bits at the stem base and keep humidity consistent. Stems still look somewhat elongated/leggy (matches earlier note), so a brighter spot will encourage sturdier growth. No blooms visible in this shot. Sharing its pot with the Parlor Palm, whose fronds appear alongside it."], "hasAction": true}, {"id": "parlor-palm", "name": "Parlor Palm", "nickname": "", "location": "Big Room (upstairs), West-facing window", "photos": [{"src": "images/parlor-palm-2026-06-15.jpeg", "date": "2026-06-15", "label": "Jun 15, 2026"}], "thumb": null, "waterStatus": "check", "waterMsg": "Soil check due \u2014 last watered 8d ago (interval: 7d). Check if fully dry before watering.", "fertStatus": "due", "fertMsg": "Due now \u2014 feed with today's watering (half-strength; last: 32d ago)", "notes": ["Shared pot: Growing together with the Anthurium. Their watering needs are compatible \u2014 water both on the same schedule.", "Currently looking full, lush, and vibrant with just minor dry pale tips on some fronds \u2014 very common indoors.", "Pest watch: Dense fine foliage can attract spider mites if air is too dry. Periodically wipe fronds with a damp cloth or give the plant a gentle shower rinse to deter pests and remove dust.", "Photo check (2026-06-15): Full, lush, and arching with deep green feathery fronds \u2014 looking vibrant and healthy. Only minor pale/dry tips on a few frond ends, which is very common indoors and may point to mineral buildup or dry air; filtered water and a touch more humidity will help. No yellowing fronds or visible pests. The Anthurium it shares space with is just out of frame to one side."], "hasAction": true}, {"id": "hoya-krimson-queen", "name": "Hoya 'Krimson Queen'", "nickname": "", "location": "Upstairs Bathroom, skylight", "photos": [{"src": "images/hoya-krimson-queen.jpeg", "date": "", "label": ""}, {"src": "images/hoya-krimson-queen-2026-06-16.jpeg", "date": "2026-06-16", "label": "Jun 16, 2026"}], "thumb": null, "waterStatus": "ok", "waterMsg": "Last watered 9d ago \u2014 next check in ~1d", "fertStatus": "pending", "fertMsg": "Feed with next watering \u2014 overdue but soil isn't dry yet (last: 32d ago)", "notes": ["Acclimation: Transitioned slowly from a lower-light bathroom to the West-facing window \u2014 started 3\u20134 feet back, moved closer over two weeks to prevent sunburn.", "Hoya pauses are normal: if care is correct but growth has stalled, the plant is likely building its root system underground.", "Photo check (2026-06-16): Young 4\" nursery plant (price tag still attached) in a striped cachepot. Foliage looks healthy \u2014 leaves are firm, glossy, and well-variegated with creamy-white margins around green centers; no yellowing, browning, or scorch on the white edges. A couple of long, bare tendrils are reaching out, which is normal Krimson Queen behavior \u2014 leave them to find a support to climb. New growth shows a faint pink blush at the edges, a sign it's getting good light. Soil looks like the original nursery mix, so plan to repot into the chunky airy mix only once it's rootbound."], "hasAction": false}, {"id": "dieffenbachia", "name": "Dieffenbachia (Dumb Cane)", "nickname": "Dumb Cane", "location": "Dining Room, West-facing window", "photos": [{"src": "images/dieffenbachia-2026-06-15.jpeg", "date": "2026-06-15", "label": "Jun 15, 2026"}], "thumb": "images/dieffenbachia-2026-06-15-thumb.png", "waterStatus": "ok", "waterMsg": "Last watered 1d ago \u2014 next check in ~6d", "fertStatus": "ok", "fertMsg": "Last fertilized 1d ago \u2014 next due in ~27d", "notes": ["Rotate: Give the pot a quarter-turn every time you water to prevent the plant from leaning toward the light and growing lopsided.", "Sap safety: Wash hands (or wear gloves) after any contact with the sap when pruning or removing dead leaves.", "Natural aging: Shedding the lowest, oldest leaves as new growth pushes from the top is normal \u2014 this is how the characteristic thick cane forms.", "Photo check (2026-06-15): Variegation is still showing nicely \u2014 leaves keep their cream/yellow speckling, a good sign the west window is giving enough light. The plant looks a bit open and leggy, though: stems are stretching and leaning outward with bare gaps between leaves, and a few of the lower/inner leaves are drooping and slightly pale. Keep up the quarter-turn at every watering to even out the lean, and consider cutting back a leggy cane in spring/summer to encourage bushier growth lower down. No obvious scorch, pests, or rot visible. Soil looks dark/moist, so let the top 2\u20133 inches dry fully before the next water."], "hasAction": false}, {"id": "rieger-begonia", "name": "Rieger Begonia (Elatior Begonia)", "nickname": "", "location": "Big Room, West-facing window", "photos": [{"src": "images/rieger-begonia-2026-06-15.jpeg", "date": "2026-06-15", "label": "Jun 15, 2026"}], "thumb": null, "waterStatus": "ok", "waterMsg": "Last watered 1d ago \u2014 next check in ~6d", "fertStatus": "ok", "fertMsg": "Last fertilized 1d ago \u2014 next due in ~27d", "notes": ["Transition shock is normal: dropping buds or leaves in the first two weeks after bringing home from a greenhouse is very common. Be patient during acclimation.", "Seasonal bloomer: it is normal for Rieger begonias to die back after their heavy bloom cycle ends. Many treat them as long-lasting floral arrangements. With careful pruning and a resting period (reduced water, cooler temps), you can coax them to rebloom the following year.", "Photo check (2026-06-15): Looking healthy and full \u2014 sturdy green stems with glossy, deep green serrated leaves and a cluster of fresh yellow buds opening on one side, so it's actively blooming. A few spent/crispy flowers and bits of debris are sitting on the soil surface near the base; deadhead these and clear them off to prevent rot on the soil surface and redirect energy into new buds. No signs of scorch, yellowing, or pests."], "hasAction": false}, {"id": "monstera-deliciosa", "name": "Monstera Deliciosa", "nickname": "", "location": "Dining room, west-facing", "photos": [{"src": "images/monstera-deliciosa-2026-06-15.jpeg", "date": "2026-06-15", "label": "Jun 15, 2026"}], "thumb": null, "waterStatus": "ok", "waterMsg": "Last watered 9d ago \u2014 next check in ~1d", "fertStatus": "pending", "fertMsg": "Feed with next watering \u2014 overdue but soil isn't dry yet (last: 32d ago)", "notes": ["Teenage Phase: Currently in juvenile phase with solid, healthy, glossy leaves. As the plant grows larger and gets ample bright light, new leaves will naturally develop the famous splits and fenestrations.", "Support Needed: This is a natural climber \u2014 insert a moss pole or coco coir stake into the pot center to give aerial roots something to grip, encouraging larger, more dramatic upright growth.", "Maintenance: Wipe large leaves with a damp cloth every few weeks to remove dust and help the plant photosynthesize.", "Photo check (2026-06-15): Plant looks healthy and actively growing. Leaves are a vibrant, glossy deep green with no yellowing, browning, or signs of pests. Several long vines are extending outward from the coco coir moss pole, indicating strong growth energy. Plant is successfully trained on the moss pole with twist ties visible securing the vines. Aerial roots appear to be developing. The growth is somewhat sprawling/leggy rather than tightly hugging the pole \u2014 encourage aerial roots to grip the pole by misting it regularly to keep it moist. No pest damage or stress symptoms visible."], "hasAction": false}, {"id": "money-tree", "name": "Money Tree", "nickname": "", "location": "Dining room, west-facing", "photos": [{"src": "images/money-tree-2026-06-15.jpeg", "date": "2026-06-15", "label": "Jun 15, 2026"}], "thumb": null, "waterStatus": "ok", "waterMsg": "Last watered 6d ago \u2014 next check in ~4d", "fertStatus": "pending", "fertMsg": "Feed with next watering \u2014 overdue but soil isn't dry yet (last: 32d ago)", "notes": ["Moving Stress: Money trees dislike being moved frequently. Leaf drop after relocation is normal as it adjusts to new light and humidity. Pick a good spot and leave it be.", "Trunk Care: The braided trunks are bound when young. As the plant grows, check the top of the braid to ensure nursery ties or wires aren't cutting into the bark and choking the stems.", "Photo check (2026-06-15): Foliage looks healthy \u2014 leaflets are a vibrant, even green with no yellowing, browning, or leaf drop visible. A few branches are stretching out long toward the window, which is typical reaching for light; keep up the weekly 90\u00b0 rotation to even out growth, and consider pinching back the longest stems above a node to encourage bushier branching. Sitting right at the west-facing window, so watch for leaf scorch from harsh direct afternoon sun in summer."], "hasAction": false}, {"id": "marble-queen-pothos", "name": "Marble Queen Pothos", "nickname": "", "location": "Living Room, East-facing window", "photos": [{"src": "images/marble-queen-pothos-2026-06-15.jpeg", "date": "2026-06-15", "label": "Jun 15, 2026"}], "thumb": null, "waterStatus": "ok", "waterMsg": "Last watered 6d ago \u2014 next check in ~6d", "fertStatus": "pending", "fertMsg": "Feed with next watering \u2014 overdue but soil isn't dry yet (last: 32d ago)", "notes": ["Placement: Trailing vines look fantastic cascading from a high shelf or cabinet.", "Propagation: One of the easiest plants to propagate. Cut trimmed vines into segments each with one leaf and a node, place in water, and roots appear in a couple of weeks \u2014 ready to plant back into the pot.", "Photo check (2026-06-15): Trailing beautifully over the cabinet with long, full vines and strong creamy-white-and-green marbling \u2014 the high variegation confirms it's getting enough bright, indirect light. There's a cluster of crispy brown dried leaves at the center near the soil; trim these out at the base to tidy it up. A couple of leaf tips show minor browning, which can follow letting it go fully bone-dry \u2014 keep watering once the top 50\u201375% of soil is dry. No signs of pests or reversion to solid green."], "hasAction": false}, {"id": "aloe-vera", "name": "Aloe Vera", "nickname": "", "location": "Big Room (upstairs), West-facing window", "photos": [{"src": "images/aloe-vera-2026-06-16.jpeg", "date": "2026-06-16", "label": "Jun 16, 2026"}], "thumb": null, "waterStatus": "ok", "waterMsg": "Last watered 1d ago \u2014 next check in ~20d", "fertStatus": "ok", "fertMsg": "Last fertilized 22d ago \u2014 next due in ~6d", "notes": ["Drooping lower leaves: Caused by slightly lower light than ideal combined with the weight of water in the leaves. Moving to the sunniest window will help new center growth come in tight and vertical.", "Maintenance: Clear out dried, crispy brown debris from the base to keep clean and deter pests like mealybugs.", "First Aid Gel: Clear gel inside mature leaves soothes minor burns. If needed, snip an entire lower leaf from the very base rather than cutting the tip \u2014 the plant heals cleanly at the main stem connection.", "Photo check (2026-06-16): Leaves are plump, firm, and a healthy green with the classic young-aloe white speckling \u2014 no mushy or translucent spots, so no sign of overwatering. The rosette is splaying wide and arching outward/downward rather than growing upright, which confirms the light is a touch low; move it onto the sunniest south- or west-facing sill to tighten up new center growth. One inner leaf is yellowing \u2014 likely just an aging lower leaf, but if more follow, ease off watering. Still potted in a terracotta inner pot inside a black cachepot (good \u2014 terracotta breathes), and there's loose mix and the old nursery tag on the soil surface worth clearing out to deter pests."], "hasAction": false}, {"id": "dracaena-malaika", "name": "Dracaena 'Malaika' (Ribbon Plant)", "nickname": "", "location": "Dining room, west-facing", "photos": [{"src": "images/dracaena-malaika-2026-06-15.jpeg", "date": "2026-06-15", "label": "Jun 15, 2026"}], "thumb": null, "waterStatus": "ok", "waterMsg": "Last watered 1d ago \u2014 next check in ~13d", "fertStatus": "ok", "fertMsg": "Last fertilized 1d ago \u2014 next due in ~27d", "notes": ["Currently a beautifully compact, full rosette growing close to the soil. Over time it will naturally drop lower leaves and build a woody trunk, developing a miniature palm-like appearance.", "Grooming: Wipe long leaves with a damp cloth every few weeks to remove dust and keep them glossy. Gently peel away or snip naturally yellowing lower leaves at the base.", "Trimming tips: If leaf tips develop minor brown crispy edges, trim with sharp scissors following the natural pointed curve of the leaf \u2014 never cut straight across.", "Photo check (2026-06-15): Looking healthy and full \u2014 a dense, arching rosette of strap leaves with crisp variegation (deep green margins, mint stripes, bright white center line), which means the light level at the west window is keeping the variegation vibrant. Leaves are a glossy, even green with no yellowing or mushiness. A couple of leaf tips show very minor browning \u2014 easy to keep an eye on; since this one is sensitive to fluoride/chlorine/salts, using filtered or distilled water will help prevent crispy tips. No pests or scorch visible. Still close to the soil with no woody trunk yet, as expected for its age."], "hasAction": false}, {"id": "snake-plant-1", "name": "Snake Plant #1", "nickname": "", "location": "Big Room, upstairs", "photos": [], "thumb": null, "waterStatus": "ok", "waterMsg": "Last watered 9d ago \u2014 next check in ~12d", "fertStatus": "pending", "fertMsg": "Feed with next watering \u2014 overdue but soil isn't dry yet (last: 32d ago)", "notes": ["Stalled growth: After 3+ years with no new growth in bright indirect light, roots are very likely circling the pot and need more space. Check by sliding the root ball out \u2014 tightly wound, circling roots confirm it's time to repot.", "Propagation: Extremely easy to propagate via leaf cuttings or by dividing pups (offshoots) at the base. Pups can be potted up individually.", "Resilience: One of the most forgiving houseplants \u2014 can tolerate neglect, low light, and irregular watering better than almost anything else."], "hasAction": false}, {"id": "snake-plant-2", "name": "Snake Plant #2", "nickname": "", "location": "Big Room, upstairs", "photos": [], "thumb": null, "waterStatus": "ok", "waterMsg": "Last watered 9d ago \u2014 next check in ~12d", "fertStatus": "pending", "fertMsg": "Feed with next watering \u2014 overdue but soil isn't dry yet (last: 32d ago)", "notes": ["Stalled growth: After 3+ years with no new growth in bright indirect light, roots are very likely circling the pot and need more space. Check by sliding the root ball out \u2014 tightly wound, circling roots confirm it's time to repot.", "Propagation: Extremely easy to propagate via leaf cuttings or by dividing pups (offshoots) at the base. Pups can be potted up individually.", "Resilience: One of the most forgiving houseplants \u2014 can tolerate neglect, low light, and irregular watering better than almost anything else."], "hasAction": false}, {"id": "tradescantia-nanouk", "name": "Tradescantia 'Nanouk'", "nickname": "", "location": "Kitchen, East-facing window", "photos": [{"src": "images/tradescantia-nanouk.jpeg", "date": "", "label": ""}], "thumb": "images/tradescantia-nanouk-thumb.png", "waterStatus": "ok", "waterMsg": "Last watered 4d ago \u2014 next check in ~1d", "fertStatus": "pending", "fertMsg": "Feed with next watering \u2014 overdue but soil isn't dry yet (last: never recorded)", "notes": ["Newly propagated: prioritize steady light moisture and warmth over a strict watering interval until rooted.", "Variegation is light-dependent \u2014 if the pink dwindles, give it more bright indirect light. Prune any all-green reverting stems."], "hasAction": false}, {"id": "tradescantia-nanouk-2", "name": "Tradescantia 'Nanouk' #2", "nickname": "Nanouk #2 #2", "location": "Kitchen", "photos": [{"src": "images/tradescantia-nanouk-2-2026-06-19.jpeg", "date": "2026-06-19", "label": "Jun 19, 2026"}], "thumb": null, "waterStatus": "ok", "waterMsg": "Last watered 1d ago \u2014 next check in ~4d", "fertStatus": "pending", "fertMsg": "Feed with next watering \u2014 overdue but soil isn't dry yet (last: never recorded)", "notes": ["Newly potted water-rooted cutting (2026-06-18): prioritize steady light moisture and warmth over a strict watering interval until it settles into soil. Water-rooted cuttings can sulk for a week or two while they grow soil roots.", "Variegation is light-dependent \u2014 if the pink dwindles, give it more bright indirect light. Prune any all-green reverting stems.", "Photo check (2026-06-19): Healthy young cutting in a biodegradable peat pot. Strong variegation \u2014 leaves striped green, cream, and pink/lilac with vivid magenta-purple stems and undersides, which means it's getting good light. Foliage is firm with no mushiness, yellowing, browning, or pest signs. Stem is a touch leggy with the leaves spreading wide (normal for a water-rooted cutting and easily fixed by pinching once it's actively growing). The peat pot wicks moisture and dries quickly, so check the soil often while it's this small."], "hasAction": false}, {"id": "jade-plant", "name": "Jade Plant", "nickname": "", "location": "", "photos": [{"src": "images/jade-plant-2026-06-15.jpeg", "date": "2026-06-15", "label": "Jun 15, 2026"}], "thumb": null, "waterStatus": "ok", "waterMsg": "Last watered 9d ago \u2014 next check in ~5d", "fertStatus": "ok", "fertMsg": "Last fertilized 9d ago \u2014 next due in ~19d", "notes": ["Stalled growth: has stayed about the same size for a long time. Most likely cause is too little light (see the leggy form), not watering \u2014 adding water won't help and risks rot. Fix the light first.", "Photo check (2026-06-15): Small jade that's been the same size for a while. The leaves are a healthy firm green with no yellowing, mushiness, or wrinkling, so it is not water-stressed. Growth is leggy/stretched \u2014 a long bare reddish stem with leaves bunched only near the tip, a classic sign of too little light. Move it to the brightest window available (south- or west-facing) to wake up growth and keep it compact, then pinch the tip above a leaf pair to push side branching. Soil reads dry on top (normal for jade); the pale specks are perlite/mineral, not pest activity. Last watered ~2026-06-01, so it's about at its summer interval \u2014 do a soil check and only water if it's dry all the way down."], "hasAction": false}, {"id": "spider-plant", "name": "Spider Plant (Variegated)", "nickname": "Spiderling", "location": "", "photos": [{"src": "images/spider-plant-2026-06-18.jpeg", "date": "2026-06-18", "label": "Jun 18, 2026"}], "thumb": null, "waterStatus": "ok", "waterMsg": "Last watered 6d ago \u2014 next check in ~1d", "fertStatus": "pending", "fertMsg": "Feed with next watering \u2014 overdue but soil isn't dry yet (last: never recorded)", "notes": ["Newly potted plantlet \u2014 keep the soil lightly moist (not soggy) while it establishes roots, and hold off on fertilizer until it shows active new growth.", "Grows from a young plantlet into a full arching fountain; the peat pot it's in can be planted whole into its next container so the tender roots aren't disturbed.", "Photo check (2026-06-18): A young variegated spider plant in a small biodegradable peat pot. Leaves are long, narrow, and arching with healthy green centers and creamy variegation along the edges \u2014 good color with no yellowing, mushiness, or pest signs visible. Leaf tips are clean with no browning yet; since spider plants are sensitive to fluoride/chlorine/salts, using filtered or distilled water will help keep the tips from going crispy as it grows. The peat pot wicks moisture quickly and can dry out fast, so check the soil often while it's this small. Still a single small clump with no runners yet, as expected at this size."], "hasAction": false}];

const ICONS = {"leaf": "<path d=\"M11 20A7 7 0 0 1 9.8 6.1C15.5 5 17 4.48 19 2c1 2 2 4.18 2 8 0 5.5-4.78 10-10 10Z\"/><path d=\"M2 21c0-3 1.85-5.36 5.08-6C9.5 14.52 12 13 13 12\"/>", "droplet": "<path d=\"M12 22a7 7 0 0 0 7-7c0-2-1-3.9-3-5.5s-3.5-4-4-6.5c-.5 2.5-2 4.9-4 6.5C6 11.1 5 13 5 15a7 7 0 0 0 7 7z\"/>", "droplets": "<path d=\"M7 16.3c2.2 0 4-1.83 4-4.05 0-1.16-.57-2.26-1.71-3.19S7.29 6.75 7 5.3c-.29 1.45-1.14 2.84-2.29 3.76S3 11.1 3 12.25c0 2.22 1.8 4.05 4 4.05z\"/><path d=\"M12.56 6.6A10.97 10.97 0 0 0 14 3.02c.5 2.5 2 4.9 4 6.5s3 3.5 3 5.5a6.98 6.98 0 0 1-11.91 4.97\"/>", "sprout": "<path d=\"M14 9.536V7a4 4 0 0 1 4-4h1.5a.5.5 0 0 1 .5.5V5a4 4 0 0 1-4 4 4 4 0 0 0-4 4c0 2 1 3 1 5a5 5 0 0 1-1 3\"/><path d=\"M4 9a5 5 0 0 1 8 4 5 5 0 0 1-8-4\"/><path d=\"M5 21h14\"/>", "map-pin": "<path d=\"M20 10c0 4.993-5.539 10.193-7.399 11.799a1 1 0 0 1-1.202 0C9.539 20.193 4 14.993 4 10a8 8 0 0 1 16 0\"/><circle cx=\"12\" cy=\"10\" r=\"3\"/>", "triangle-alert": "<path d=\"m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3\"/><path d=\"M12 9v4\"/><path d=\"M12 17h.01\"/>", "circle-check": "<circle cx=\"12\" cy=\"12\" r=\"10\"/><path d=\"m9 12 2 2 4-4\"/>", "lightbulb": "<path d=\"M15 14c.2-1 .7-1.7 1.5-2.5 1-.9 1.5-2.2 1.5-3.5A6 6 0 0 0 6 8c0 1 .2 2.2 1.5 3.5.7.7 1.3 1.5 1.5 2.5\"/><path d=\"M9 18h6\"/><path d=\"M10 22h4\"/>", "link": "<path d=\"M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71\"/><path d=\"M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71\"/>", "check": "<path d=\"M20 6 9 17l-5-5\"/>", "maximize": "<path d=\"M15 3h6v6\"/><path d=\"m21 3-7 7\"/><path d=\"m3 21 7-7\"/><path d=\"M9 21H3v-6\"/>", "x": "<path d=\"M18 6 6 18\"/><path d=\"m6 6 12 12\"/>", "chevron-right": "<path d=\"m9 18 6-6-6-6\"/>", "chevron-left": "<path d=\"m15 18-6-6 6-6\"/>", "arrow-left": "<path d=\"m12 19-7-7 7-7\"/><path d=\"M19 12H5\"/>", "arrow-right": "<path d=\"M5 12h14\"/><path d=\"m12 5 7 7-7 7\"/>", "clipboard": "<rect width=\"8\" height=\"4\" x=\"8\" y=\"2\" rx=\"1\" ry=\"1\"/><path d=\"M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2\"/>"};
function icon(name, cls) {
  return '<svg class="ic ' + (cls || '') + '" viewBox="0 0 24 24" fill="none" '
       + 'stroke="currentColor" stroke-width="2" stroke-linecap="round" '
       + 'stroke-linejoin="round" aria-hidden="true">' + ICONS[name] + '</svg>';
}
// Drop a leaf icon into an avatar tile when its photo fails to load.
function avatarFallback(el) { el.classList.remove('cut'); el.innerHTML = icon('leaf'); }

// ── Check-off state (persisted per-day) ──
const TODAY = "2026-06-24";
const SUMMARY_DATE = "Jun 24";
const SKEY = 'pc-actions-' + TODAY;
let actions = {};
try { actions = JSON.parse(localStorage.getItem(SKEY)) || {}; } catch (e) { actions = {}; }

function getA(name) { return actions[name] || {w: false, wet: false, f: false}; }
function toggleA(name, key) {
  const a = getA(name);
  const nv = !a[key];
  a[key] = nv;
  // Watered and "soil still wet" are mutually exclusive outcomes of one check.
  if (nv && key === 'w') a.wet = false;
  if (nv && key === 'wet') a.w = false;
  actions[name] = a;
  try { localStorage.setItem(SKEY, JSON.stringify(actions)); } catch (e) {}
  updateBar();
  return nv;
}

// ── List ──
function buildList() {
  const urgent = P.filter(p => p.hasAction);
  const ok     = P.filter(p => !p.hasAction);
  let h = '';
  if (urgent.length) {
    h += `<div class="sec-label warn">${icon('triangle-alert')} Needs attention (${urgent.length})</div>`;
    urgent.forEach((p, i) => h += rowHTML(p, i));
  }
  if (ok.length) {
    h += `<div class="sec-label">${icon('circle-check')} All good (${ok.length})</div>`;
    ok.forEach((p, i) => h += rowHTML(p, urgent.length + i));
  }
  const el = document.getElementById('list-scroll');
  const prevScroll = el.scrollTop;
  el.innerHTML = h;
  el.querySelectorAll('.chk').forEach(b => b.addEventListener('click', e => {
    e.stopPropagation();
    toggleA(P[+b.dataset.i].name, b.dataset.act);
    buildList();  // rebuild so mutually-exclusive siblings refresh
  }));
  el.querySelectorAll('.row').forEach(r =>
    r.addEventListener('click', () => openDetail(+r.dataset.i))
  );
  el.scrollTop = prevScroll;
  updateBar();
}

function rowHTML(p, i) {
  const loc = p.location ? `<div class="row-loc">${icon('map-pin')} ${p.location}</div>` : '';
  const a = getA(p.name);
  // What does this plant need today? Drives both the chips and which buttons glow.
  const waterNeed = p.waterStatus === 'check';
  const noRecord  = p.waterStatus === 'unknown';
  const fertNeed  = p.fertStatus === 'due';
  const fertPending = p.fertStatus === 'pending';

  const chips = [];
  if (waterNeed) chips.push(`<span class="need-chip water">${icon('droplet')} Soil check due</span>`);
  if (noRecord)  chips.push(`<span class="need-chip unknown">${icon('droplet')} No water record</span>`);
  if (fertNeed)  chips.push(`<span class="need-chip fert">${icon('sprout')} Feed due</span>`);
  // A pending feed (overdue but waiting on the next watering) is an "All good"
  // plant — we skip the long "Feed at next watering" chip (it wraps and
  // disrupts the row layout) and instead highlight the sprout button below.
  const needs = chips.length ? `<div class="row-needs">${chips.join('')}</div>` : '';

  // Thumbnail. A background-removed cutout (p.thumb), when available, floats on
  // the card color — so no leaf sits behind it (it would show through the
  // transparent areas); if it fails to load we drop in the leaf instead.
  // Otherwise the newest photo fills the tile over a leaf fallback.
  const photos = p.photos || [];
  const latest = photos.length ? photos[photos.length - 1] : null;
  let avatar;
  if (p.thumb) {
    avatar = `<div class="row-avatar cut"><img src="${p.thumb}" alt="" loading="lazy" onerror="avatarFallback(this.parentNode)"></div>`;
  } else if (latest) {
    avatar = `<div class="row-avatar">${icon('leaf')}<img src="${latest.src}" alt="" loading="lazy" onerror="this.remove()"></div>`;
  } else {
    avatar = `<div class="row-avatar">${icon('leaf')}</div>`;
  }

  // Orange = needs attention, green = checked off. Once one of the water pair
  // (watered / soil-still-wet) is checked, the other drops to neutral.
  const cls = (act, done) => {
    let c = 'chk' + (act === 'wet' ? ' wet' : '');
    if (done) return c + (act === 'wet' ? ' snooze' : ' done');
    if (act === 'w' && a.wet) return c;
    if (act === 'wet' && a.w) return c;
    if ((act === 'w' || act === 'wet') && (waterNeed || noRecord)) c += ' need';
    if (act === 'f' && fertNeed) c += ' need';
    // Pending feed: calm blue highlight instead of the orange "need" alarm.
    if (act === 'f' && fertPending) c += ' pending';
    return c;
  };
  // With the chip gone, let the sprout button's tooltip carry the pending detail.
  const fertTitle = fertPending ? 'Feed due at next watering' : 'Fertilized';

  // Only surface the action icons a plant actually needs. An "All good" plant
  // (no attention item) needs no watering today — otherwise it would sit under
  // "Needs attention" — so we drop the two water buttons there and keep the
  // sprout only when a feed is waiting on the next watering (or already ticked).
  const waterBtns =
      `<button class="${cls('w', a.w)}" data-i="${i}" data-act="w" aria-label="Mark watered" title="Watered">${icon('droplet')}</button>`
    + `<button class="${cls('wet', a.wet)}" data-i="${i}" data-act="wet" aria-label="Soil still wet" title="Checked — soil still wet">${icon('droplets')}</button>`;
  const fertBtn =
      `<button class="${cls('f', a.f)}" data-i="${i}" data-act="f" aria-label="${fertTitle}" title="${fertTitle}">${icon('sprout')}</button>`;
  const dots = p.hasAction ? (waterBtns + fertBtn) : ((fertPending || a.f) ? fertBtn : '');
  const dotsHTML = dots ? `<div class="row-dots">${dots}</div>` : '';

  return `<div class="row${p.hasAction ? ' urgent' : ''}" data-i="${i}">
  ${avatar}
  <div class="row-info">
    <div class="row-name">${p.nickname || p.name}</div>${loc}${needs}
  </div>
  ${dotsHTML}
  <div class="chevron">${icon('chevron-right')}</div>
</div>`;
}

// ── Detail ──
// Each plant has a stable `id` (its care-log key). We mirror the open plant
// into the URL hash (e.g. #money-tree) so a detail page is directly
// shareable / bookmarkable and the browser back button works.
function plantIndexById(id) {
  for (let i = 0; i < P.length; i++) if (P[i].id === id) return i;
  return -1;
}

function detailShown() {
  return !document.getElementById('detail-view').classList.contains('hidden');
}

function showDetail(i, dir) {
  document.getElementById('list-view').classList.add('hidden');
  document.getElementById('detail-view').classList.remove('hidden');
  renderDetail(i, dir);  // sets cur = i
}

function showList() {
  document.getElementById('detail-view').classList.add('hidden');
  document.getElementById('list-view').classList.remove('hidden');
  buildList();
}

// Open a plant by writing the hash; the hashchange handler does the rendering,
// which keeps a real history entry so back returns to the list.
function openDetail(i) {
  location.hash = encodeURIComponent(P[i].id);
}

// Drive the visible view from the current URL hash.
function applyHash() {
  const id = decodeURIComponent(location.hash.slice(1));
  const i = id ? plantIndexById(id) : -1;
  if (i >= 0) {
    if (!detailShown() || cur !== i) showDetail(i, 0);
  } else if (detailShown()) {
    showList();
  }
}
window.addEventListener('hashchange', applyHash);

function renderDetail(i, dir) {
  cur = i;
  const p = P[i];
  document.getElementById('d-title').textContent = p.nickname || p.name;
  document.getElementById('d-counter').textContent = `${i + 1} / ${P.length}`;
  document.getElementById('prev-btn').disabled = i === 0;
  document.getElementById('next-btn').disabled = i === P.length - 1;

  // Hint between the ← / → buttons. A bare name is ambiguous (next? previous?),
  // so label it directionally: normally it previews the next plant; on the last
  // plant the → is disabled, so it points back to the previous one instead.
  const nextP = P[i + 1], prevP = P[i - 1];
  const nextName = n => n.nickname || n.name;
  document.getElementById('nav-hint').textContent =
    nextP ? `Next: ${nextName(nextP)} →`
          : (prevP ? `← Prev: ${nextName(prevP)}` : '');

  const notesHTML = p.notes && p.notes.length
    ? `<div class="notes"><strong>${icon('lightbulb')} Notes</strong><ul>${
        p.notes.map(n => `<li>${n}</li>`).join('')}</ul></div>`
    : '';

  const photoHTML = galleryHTML(p);

  const dLabels = {
    w:   {icon: 'droplet',  on: 'Watered',        off: 'Mark watered'},
    wet: {icon: 'droplets', on: 'Soil still wet', off: 'Soil still wet'},
    f:   {icon: 'sprout',   on: 'Fertilized',     off: 'Mark fertilized'},
  };
  const a = getA(p.name);
  const waterNeed = p.waterStatus === 'check' || p.waterStatus === 'unknown';
  const fertNeed  = p.fertStatus === 'due';
  // Same rules as the list: orange = needs attention, green = checked off,
  // and the unchosen half of the water pair stays neutral.
  const dCls = k => {
    if (a[k]) return 'd-chk ' + (k === 'wet' ? 'snooze' : 'done');
    if (k === 'w' && a.wet) return 'd-chk';
    if (k === 'wet' && a.w) return 'd-chk';
    if ((k === 'w' || k === 'wet') && waterNeed) return 'd-chk need';
    if (k === 'f' && fertNeed) return 'd-chk need';
    return 'd-chk';
  };
  const dBtn = k => {
    const l = dLabels[k];
    const tail = a[k] ? ' ' + icon('check') : '';
    return `<button class="${dCls(k)}" data-act="${k}">${icon(l.icon)} ${a[k] ? l.on : l.off}${tail}</button>`;
  };
  const actionsHTML = `<div class="d-actions">${dBtn('w')}${dBtn('wet')}${dBtn('f')}</div>`;

  const animClass = dir > 0 ? 'from-right' : dir < 0 ? 'from-left' : '';
  const scr = document.getElementById('detail-scroll');
  scr.innerHTML = `<div class="${animClass} d-body">
    ${photoHTML}
    <div class="d-content">
      <div class="d-name">${p.name}</div>
      ${p.location ? `<div class="d-loc">${icon('map-pin')} ${p.location}</div>` : ''}
      <div class="badge ${p.waterStatus}">${icon('droplet')} ${p.waterMsg}</div>
      <div class="badge ${p.fertStatus}">${icon('sprout')} ${p.fertMsg}</div>
      ${actionsHTML}
      ${notesHTML}
    </div>
  </div>`;
  scr.scrollTop = 0;
  initGallery(scr);

  // Tapping a photo (or its maximize button) opens the full-screen zoomable viewer.
  scr.querySelectorAll('.plant-photo').forEach(im =>
    im.addEventListener('click', () => openLightbox(im.src, im.alt))
  );
  scr.querySelectorAll('.g-zoom').forEach(b => b.addEventListener('click', e => {
    e.stopPropagation();
    openLightbox(b.dataset.src, '');
  }));

  scr.querySelectorAll('.d-chk').forEach(b => b.addEventListener('click', () => {
    toggleA(p.name, b.dataset.act);
    renderDetail(i, 0);  // re-render so mutually-exclusive buttons refresh
  }));
}

// ── Photo gallery (per plant) ──
function galleryHTML(p) {
  const photos = p.photos || [];
  if (!photos.length) return '';
  const slides = photos.map(ph => `<div class="slide">
      <img class="plant-photo" src="${ph.src}" alt="${p.name}"
           onerror="this.closest('.slide').style.display='none'">
      <button class="g-zoom" type="button" aria-label="Maximize photo" data-src="${ph.src}">${icon('maximize')}</button>
      ${ph.label ? `<span class="photo-date">${ph.label}</span>` : ''}
    </div>`).join('');
  const multi = photos.length > 1;
  const nav = multi
    ? `<button class="g-nav g-prev" aria-label="Older photo">${icon('chevron-left')}</button>
       <button class="g-nav g-next" aria-label="Newer photo">${icon('chevron-right')}</button>
       <div class="g-dots">${photos.map((_, i) => `<span class="g-dot" data-i="${i}"></span>`).join('')}</div>`
    : '';
  return `<div class="gallery"><div class="gallery-track">${slides}</div>${nav}</div>`;
}

function initGallery(root) {
  const g = root.querySelector('.gallery');
  if (!g) return;
  const track = g.querySelector('.gallery-track');
  const slides = [...track.querySelectorAll('.slide')];
  if (slides.length < 2) return;
  const dots = [...g.querySelectorAll('.g-dot')];
  const prev = g.querySelector('.g-prev'), next = g.querySelector('.g-next');
  const curIdx = () => Math.round(track.scrollLeft / track.clientWidth);
  const goTo = idx => {
    idx = Math.max(0, Math.min(slides.length - 1, idx));
    track.scrollTo({left: idx * track.clientWidth, behavior: 'smooth'});
  };
  const sync = () => {
    const i = curIdx();
    dots.forEach((d, j) => d.classList.toggle('active', j === i));
    prev.disabled = i === 0;             // leftmost = oldest
    next.disabled = i === slides.length - 1;  // rightmost = newest
  };
  prev.addEventListener('click', () => goTo(curIdx() - 1));
  next.addEventListener('click', () => goTo(curIdx() + 1));
  dots.forEach(d => d.addEventListener('click', () => goTo(+d.dataset.i)));
  track.addEventListener('scroll', () => {
    clearTimeout(track._t); track._t = setTimeout(sync, 60);
  }, {passive: true});
  // Open focused on the latest photo (rightmost), then let the user scroll back.
  requestAnimationFrame(() => { track.scrollLeft = track.scrollWidth; sync(); });
}

function goTo(i, dir) {
  if (i < 0 || i >= P.length) return;
  renderDetail(i, dir);  // animate first (sets cur = i)…
  // …then sync the hash. cur is already i, so the resulting hashchange is a
  // no-op — this just keeps the URL shareable without re-rendering.
  const h = encodeURIComponent(P[i].id);
  if (location.hash.slice(1) !== h) location.hash = h;
}

// ── Action bar: copy / clear ──
function checkedNames() {
  const watered = [], stillWet = [], fed = [];
  P.forEach(p => {
    const a = getA(p.name);
    if (a.w) watered.push(p.name);
    if (a.wet) stillWet.push(p.name);
    if (a.f) fed.push(p.name);
  });
  return {watered, stillWet, fed};
}

function updateBar() {
  const {watered, stillWet, fed} = checkedNames();
  const total = watered.length + stillWet.length + fed.length;
  const count = document.getElementById('bar-count');
  if (total === 0) {
    count.innerHTML = `Tap ${icon('droplet')} / ${icon('droplets')} / ${icon('sprout')} to check off as you go`;
  } else {
    const parts = [];
    if (watered.length) parts.push(`${icon('droplet')} ${watered.length} watered`);
    if (stillWet.length) parts.push(`${icon('droplets')} ${stillWet.length} still wet`);
    if (fed.length) parts.push(`${icon('sprout')} ${fed.length} fertilized`);
    count.innerHTML = parts.join('  ·  ');
  }
  const copyBtn = document.getElementById('copy-btn');
  copyBtn.disabled = total === 0;
  copyBtn.innerHTML = total > 0 ? `${icon('clipboard')} Copy ${total}` : `${icon('clipboard')} Copy`;
  document.getElementById('clear-btn').classList.toggle('hidden', total === 0);
}

function buildSummary() {
  const {watered, stillWet, fed} = checkedNames();
  const lines = [`Plant care — ${SUMMARY_DATE}`, ''];
  if (watered.length) {
    lines.push('Watered:');
    watered.forEach(n => lines.push(`- ${n}`));
    lines.push('');
  }
  if (stillWet.length) {
    lines.push('Soil checked — still wet, skipped watering:');
    stillWet.forEach(n => lines.push(`- ${n}`));
    lines.push('');
  }
  if (fed.length) {
    lines.push('Fertilized:');
    fed.forEach(n => lines.push(`- ${n}`));
    lines.push('');
  }
  return lines.join('\n').trim();
}

function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(t._timer);
  t._timer = setTimeout(() => t.classList.remove('show'), 2200);
}

function copyText(text) {
  if (navigator.clipboard && navigator.clipboard.writeText) {
    return navigator.clipboard.writeText(text);
  }
  return new Promise((resolve, reject) => {
    const ta = document.createElement('textarea');
    ta.value = text;
    ta.style.position = 'fixed';
    ta.style.opacity = '0';
    document.body.appendChild(ta);
    ta.select();
    try { document.execCommand('copy'); resolve(); }
    catch (e) { reject(e); }
    finally { document.body.removeChild(ta); }
  });
}

document.getElementById('copy-btn').addEventListener('click', () => {
  const text = buildSummary();
  if (!text) return;
  copyText(text)
    .then(() => showToast('Copied to clipboard'))
    .catch(() => showToast('Copy failed — long-press to select'));
});

document.getElementById('clear-btn').addEventListener('click', () => {
  actions = {};
  try { localStorage.removeItem(SKEY); } catch (e) {}
  buildList();
});

// ── Events ──
document.getElementById('back-btn').addEventListener('click', () => {
  // Drop the plant from the URL; the hashchange handler returns to the list.
  // If there's no hash (deep-linked straight to a detail), switch directly.
  if (location.hash) history.replaceState(null, '', location.pathname + location.search);
  showList();
});
// Copy a shareable deep link to the plant currently shown in the detail view.
document.getElementById('link-btn').addEventListener('click', () => {
  const url = location.origin + location.pathname + location.search
            + '#' + encodeURIComponent(P[cur].id);
  copyText(url)
    .then(() => showToast('Link copied'))
    .catch(() => showToast('Copy failed — long-press to select'));
});
document.getElementById('prev-btn').addEventListener('click', () => goTo(cur - 1, -1));
document.getElementById('next-btn').addEventListener('click', () => goTo(cur + 1,  1));

// Swipe (horizontal > vertical and > 50px threshold).
// Swipe right returns to the list view; swipe left does nothing.
// Use the on-screen ← / → buttons to page through plants.
let tx = 0, ty = 0;
const scr = document.getElementById('detail-scroll');
scr.addEventListener('touchstart', e => {
  tx = e.touches[0].clientX; ty = e.touches[0].clientY;
}, {passive: true});
scr.addEventListener('touchend', e => {
  if (e.target.closest('.gallery')) return;  // photo carousel owns horizontal swipes
  const dx = e.changedTouches[0].clientX - tx;
  const dy = e.changedTouches[0].clientY - ty;
  if (Math.abs(dx) > Math.abs(dy) * 1.5 && Math.abs(dx) > 50 && dx > 0)
    document.getElementById('back-btn').click();  // swipe right → back to list
}, {passive: true});

// Arrow keys / Escape
document.addEventListener('keydown', e => {
  // While the full-screen photo viewer is up, Escape closes it (and it swallows
  // the other keys so they don't page the underlying detail view).
  const lb = document.getElementById('lightbox');
  if (lb.isShown && lb.isShown()) {
    if (e.key === 'Escape') lb.close();
    return;
  }
  if (document.getElementById('detail-view').classList.contains('hidden')) return;
  if (e.key === 'ArrowRight') goTo(cur + 1,  1);
  if (e.key === 'ArrowLeft')  goTo(cur - 1, -1);
  if (e.key === 'Escape')     document.getElementById('back-btn').click();
});

// ── Full-screen zoomable photo viewer ──
// Transform-based pan/zoom. The <img> fills the overlay (object-fit: contain)
// with transform-origin 0 0, so viewport coords map straight to the element and
// the focal-point zoom math stays simple. Supports pinch (touch), wheel and
// double-tap/double-click to zoom, and drag to pan while zoomed.
const lightboxOpen = (() => {
  const lb = document.getElementById('lightbox');
  const img = document.getElementById('lb-img');
  const hint = document.getElementById('lb-hint');
  const MIN = 1, MAX = 6;
  let scale = 1, tx = 0, ty = 0;
  const pts = new Map();              // active pointers
  let pinchDist = 0, pinchScale = 1;  // gesture baselines
  let lastTap = 0;

  const clamp = (v, lo, hi) => Math.max(lo, Math.min(hi, v));
  const apply = () => { img.style.transform = `translate(${tx}px,${ty}px) scale(${scale})`; };

  function clampPan() {
    const W = lb.clientWidth, H = lb.clientHeight;
    const sw = W * scale, sh = H * scale;
    tx = sw <= W ? (W - sw) / 2 : clamp(tx, W - sw, 0);
    ty = sh <= H ? (H - sh) / 2 : clamp(ty, H - sh, 0);
  }

  function zoomAt(factor, fx, fy) {
    const ns = clamp(scale * factor, MIN, MAX);
    const f = ns / scale;
    tx = fx - (fx - tx) * f;
    ty = fy - (fy - ty) * f;
    scale = ns;
    clampPan();
    apply();
  }

  function reset() { scale = 1; tx = 0; ty = 0; clampPan(); apply(); }

  function open(src, alt) {
    img.src = src; img.alt = alt || '';
    reset();
    lb.classList.add('show');
    lb.setAttribute('aria-hidden', 'false');
    hint.style.opacity = '1';
    clearTimeout(hint._t);
    hint._t = setTimeout(() => { hint.style.opacity = '0'; }, 2200);
  }

  function close() {
    lb.classList.remove('show');
    lb.setAttribute('aria-hidden', 'true');
    pts.clear();
  }
  lb.isShown = () => lb.classList.contains('show');
  lb.close = close;

  // Two-finger helpers.
  const two = () => [...pts.values()];
  const dist = () => { const [a, b] = two(); return Math.hypot(a.x - b.x, a.y - b.y); };
  const mid  = () => { const [a, b] = two(); return {x: (a.x + b.x) / 2, y: (a.y + b.y) / 2}; };

  lb.addEventListener('pointerdown', e => {
    pts.set(e.pointerId, {x: e.clientX, y: e.clientY});
    lb.setPointerCapture(e.pointerId);
    if (pts.size === 2) { pinchDist = dist(); pinchScale = scale; }
  });

  lb.addEventListener('pointermove', e => {
    if (!pts.has(e.pointerId)) return;
    const prev = pts.get(e.pointerId);
    pts.set(e.pointerId, {x: e.clientX, y: e.clientY});
    if (pts.size === 2 && pinchDist) {
      const m = mid();
      const target = pinchScale * (dist() / pinchDist);
      zoomAt(clamp(target, MIN, MAX) / scale, m.x, m.y);
    } else if (pts.size === 1 && scale > 1) {
      tx += e.clientX - prev.x;
      ty += e.clientY - prev.y;
      clampPan();
      apply();
    }
  });

  function endPointer(e) {
    pts.delete(e.pointerId);
    if (pts.size < 2) pinchDist = 0;
  }
  lb.addEventListener('pointerup', endPointer);
  lb.addEventListener('pointercancel', endPointer);

  // Double-tap (touch) to toggle zoom around the tap point.
  lb.addEventListener('pointerup', e => {
    if (e.pointerType === 'mouse') return;
    const now = Date.now();
    if (now - lastTap < 300) {
      if (scale > 1.05) reset(); else zoomAt(3 / scale, e.clientX, e.clientY);
      lastTap = 0;
    } else {
      lastTap = now;
    }
  });

  img.addEventListener('dblclick', e => {
    e.preventDefault();
    if (scale > 1.05) reset(); else zoomAt(3 / scale, e.clientX, e.clientY);
  });

  lb.addEventListener('wheel', e => {
    e.preventDefault();
    zoomAt(e.deltaY < 0 ? 1.18 : 1 / 1.18, e.clientX, e.clientY);
  }, {passive: false});

  // Tap the backdrop (not the photo) to close.
  lb.addEventListener('click', e => { if (e.target === lb) close(); });
  document.getElementById('lb-close').addEventListener('click', close);

  return open;
})();
function openLightbox(src, alt) { lightboxOpen(src, alt); }

buildList();
applyHash();  // honor a shared/bookmarked #plant-id deep link on load
</script>
<script>
if ('serviceWorker' in navigator) navigator.serviceWorker.register('./sw.js');
</script>
