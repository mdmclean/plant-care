name: Update Plant Care Report

on:
  push:
    branches: [main]
  workflow_dispatch:  # allow kicking a rebuild by hand (e.g. after a Pages deploy hiccup)

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - run: pip install pyyaml

      - run: python3 generate_report.py

      - name: Commit updated report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/
          git diff --cached --quiet || git commit -m "report: auto-update $(date -u +'%Y-%m-%d')"
          git push
