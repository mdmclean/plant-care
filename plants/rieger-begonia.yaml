id: rieger-begonia
name: "Rieger Begonia (Elatior Begonia)"
status: "died"
died: "2026-08-13"
photos:
  - file: "images/rieger-begonia-2026-06-15.jpeg"
    date: "2026-06-15"
botanical_name: "Begonia x hiemalis (Elatior Group)"
type: "Herbaceous perennial (often kept as an indoor houseplant or seasonal bloomer)"
toxicity: "Toxic to dogs and cats; mildly toxic to humans. Contains soluble calcium oxalates — keep out of reach of pets and children."
growth_habit: "Upright, bushy, and mounding"

location: "Big Room, West-facing window"

light:
  ideal: "Bright, indirect light"
  placement: "Near an East or West-facing window"
  too_much: "Scorched leaves; vibrant flower colors fade rapidly"
  too_little: "Leggy growth and lack of new blooms"

watering:
  when: "Wait until the top 1–2 inches of soil feel completely dry before watering"
  how: >
    Water thoroughly at the base — allow excess to drain completely and empty the saucer.
    Avoid getting water on leaves or flowers (promotes powdery mildew and fungal infections).
    Bottom watering is ideal: set pot in a bowl of water for 15 minutes, then drain fully.
  overwatering_signs: "Root rot; mushy stems; standing water in saucer"
  underwatering_signs: "Wilting, dry soil deeper than 2 inches"
  seasonal_note: "Reduce water during the resting period after blooming ends."
  estimated_interval_days:
    spring_summer: 7
    fall_winter: 14

environment:
  temperature: "65°F–75°F (18°C–24°C). Does not tolerate freezing temperatures."
  humidity: "Thrives at 50%+. Needs good airflow alongside humidity — keep away from drafts (AC units, heaters, frequently opened exterior doors)."

soil:
  mix: "Light, highly porous, and well-draining"
  recipe: "Standard indoor potting soil + generous handful of perlite or orchid bark. African Violet mix is also a great off-the-shelf option."
  repotting: "Likes to be slightly rootbound; repotting is rarely necessary since it is often kept for a single blooming season. If needed, go up only 1–2 inches and ensure the new pot has drainage holes."

feeding:
  fertilizer: "Balanced water-soluble indoor plant fertilizer at half-strength"
  schedule: "Every 2–4 weeks while actively pushing new growth and blooming. Pause during resting period."
  active_months: [3, 4, 5, 6, 7, 8]  # March through August; adjust if blooming outside these months

pruning: >
  Deadhead regularly — pinch or snip off spent, crispy, or dropped flowers and
  yellowing leaves. This keeps the plant tidy, prevents rot on the soil surface,
  and redirects energy into producing new buds.

notes:
  - "Transition shock is normal: dropping buds or leaves in the first two weeks after bringing home from a greenhouse is very common. Be patient during acclimation."
  - "Seasonal bloomer: it is normal for Rieger begonias to die back after their heavy bloom cycle ends. Many treat them as long-lasting floral arrangements. With careful pruning and a resting period (reduced water, cooler temps), you can coax them to rebloom the following year."
  - "Died 2026-08-13 — archived. Profile and photo history kept for reference; care log entry removed so it no longer appears in the daily report. Rieger begonias commonly die back after their heavy bloom cycle, so this is a normal end for a seasonal bloomer rather than necessarily a care problem."
  - "Photo check (2026-06-15): Looking healthy and full — sturdy green stems with glossy, deep green serrated leaves and a cluster of fresh yellow buds opening on one side, so it's actively blooming. A few spent/crispy flowers and bits of debris are sitting on the soil surface near the base; deadhead these and clear them off to prevent rot on the soil surface and redirect energy into new buds. No signs of scorch, yellowing, or pests."
