id: kalanchoe
name: "Kalanchoe (Flaming Katy)"
photos:
  - file: "images/kalanchoe-2026-06-16.jpeg"
    date: "2026-06-16"
  - file: "images/kalanchoe-2026-07-05.jpeg"
    date: "2026-07-05"
  - file: "images/kalanchoe-2026-07-05b.jpeg"
    date: "2026-07-05"
botanical_name: "Kalanchoe blossfeldiana"
type: "Flowering Succulent Perennial"
toxicity: "Toxic to cats and dogs — contains cardiac glycosides causing gastrointestinal upset and abnormal heart rhythms if ingested"
growth_habit: "Compact, bushy, and upright. Scalloped, thick, dark green glossy leaves with large dense clusters of long-lasting flowers rising above the foliage."

location: "Big Room, West-facing window"

light:
  ideal: "Bright, indirect light with some direct morning sun tolerated"
  placement: "East or South-facing windowsill; West window also works. Bright light extends bloom duration and encourages reblooming."
  too_much: "Scorched, bleached leaves from harsh afternoon sun"
  too_little: "Leggy growth; few or no blooms; green-only foliage with no new buds"

watering:
  when: "Allow soil to dry out completely between waterings — this is a succulent. Check that the top 2 inches and ideally more are fully dry."
  how: "Water thoroughly until it drains from the holes, then empty the saucer. Never let it sit in standing water."
  overwatering_signs: "Mushy, yellowing leaves; soft stems; root rot — the most common cause of death for this plant"
  underwatering_signs: "Wrinkled or shriveled leaves (relatively rare and easy to recover from)"
  seasonal_note: "Water even less during the post-bloom resting period and during the short-day reblooming treatment."
  estimated_interval_days:
    spring_summer: 14
    fall_winter: 21

environment:
  temperature: "60°F–85°F. Sensitive to frost — keep away from cold drafts and uninsulated windows in winter."
  humidity: "Low to average household humidity. No misting or extra humidity needed — overly damp air can encourage fungal disease on the thick leaves."

soil:
  mix: "Fast-draining succulent or cactus mix"
  recipe: "Succulent/cactus potting mix, or standard indoor potting soil + 50% perlite"
  repotting: "Rarely needs repotting — prefers snug conditions. If needed, go up only 1–2 inches and repot in spring after blooming ends."

feeding:
  fertilizer: "Balanced water-soluble fertilizer at half-strength; a high-phosphorus formula can encourage more blooms"
  schedule: "Once monthly during the growing and blooming season. Stop feeding during the resting and short-day reblooming treatment periods."
  active_months: [3, 4, 5, 6, 7, 8]  # March through August

pruning: >
  Deadhead spent flower clusters by pinching or snipping them off at the stem.
  This keeps the plant tidy and redirects energy. Once all blooms are spent,
  cut stems back by about one-third to encourage bushy regrowth.

notes:
  - "Bloom finished (as of 2026-06-16): the spring flush of orange/yellow flowers has fully faded and the plant is now in its leafy growth stage."
  - "Deadheading: As flower clusters fade and brown, snip the flower stems off just above the leaf line with clean scissors. Keeps the plant tidy and encourages remaining buds to open."
  - "Reblooming: Once all flowers fade, the plant enters a leafy growth stage. To rebloom next year, give it a 6-week autumn rest period (around September–October) with 14 hours of complete uninterrupted darkness each night and only 10 hours of bright light per day. Combine with very minimal watering. Resume normal care after 6 weeks and buds will form within a few weeks."
  - "Photo check (2026-07-05): Several leaves are yellowing since the June 16 shot, where foliage was uniformly deep green. Two or three larger/lower leaves have gone yellow (one half green/half bright yellow), and one lower leaf shows a browned, crispy dried edge and tip. The bulk of the plant is still bushy, glossy, and healthy green with fresh growth at the tips, so this reads as a handful of older leaves being shed rather than whole-plant decline. Most likely cause: soggy soil — overwatering/root rot is this succulent's #1 killer and produces soft yellowing lower leaves. It was last watered 2026-06-26 (9 days ago), inside its 14-day summer interval, so DO NOT water on schedule. Squeeze a yellow leaf: mushy/soft = too wet (let the soil dry out fully, confirm the pot drains, and never leave it in a saucer of water); firm/dry = normal old-leaf drop, nothing to worry about. Snip off the yellow and brown-edged leaves at the base to tidy it and redirect energy. Keep it in bright light to prevent stretching. Recheck in a week — if new leaves start yellowing too, treat it as overwatering and check the roots."
  - "Photo check (2026-06-16): Foliage looks excellent — lush, dense, and bushy with thick, glossy, deep-green scalloped leaves and no spotting, yellowing, or soft stems. The blooms are completely spent now, so it has shifted into leafy growth; cut any remaining spent flower stems back by about a third to encourage bushiness. A few central shoots are reaching up toward the lamp/light, a mild hint of stretching — keep it in bright light to stay compact. Now potted in a fluted light-blue ceramic pot; make sure that pot drains and never let it sit in water, since rot is this plant's biggest risk. Mark your calendar for the September–October short-day rest to trigger next year's rebloom."
