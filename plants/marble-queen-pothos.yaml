id: marble-queen-pothos
name: "Marble Queen Pothos"
photos:
  - file: "images/marble-queen-pothos-2026-06-15.jpeg"
    date: "2026-06-15"
  - file: "images/marble-queen-pothos-2026-07-02.jpeg"
    date: "2026-07-02"
botanical_name: "Epipremnum aureum 'Marble Queen'"
type: "Tropical Evergreen Trailing Vine"
toxicity: "Toxic to cats and dogs — contains calcium oxalate crystals causing intense oral irritation and swelling if chewed"
growth_habit: "Vining, trailing, or climbing. Heart-shaped leaves heavily variegated with streaks and splashes of creamy-white, mint, and deep green."

location: "Living Room, East-facing window"

light:
  ideal: "Bright, indirect sunlight — essential for maintaining the white and green variegation"
  too_much: "Scorched pale patches on leaves from harsh direct sun"
  too_little: "Plant loses white coloring and reverts to solid green in deep shade"
  notes: "High variegation requires plenty of bright, filtered light to keep producing snowy-white leaves."

watering:
  when: "Allow the top 50–75% of soil to dry out completely before watering again"
  how: "Drench thoroughly until water flows from drainage holes, then empty the tray."
  underwatering_signs: "Whole plant visibly droops when bone-dry — perks back up within hours of a good soak"
  estimated_interval_days:
    spring_summer: 12
    fall_winter: 21

environment:
  temperature: "18°C–29°C (65°F–85°F). Protect from icy window drafts in winter and direct heat vents."
  humidity: "Highly adaptable — loves moderate to high humidity but handles average household dry air well."

soil:
  mix: "Light, chunky, well-draining potting mix"
  recipe: "Standard indoor potting mix amended with perlite and orchid bark to prevent waterlogged roots"
  repotting: "Repot every 2 years. Tolerates being slightly root-bound well — repot when roots are growing from drainage holes, going up 2 inches in pot size."

feeding:
  fertilizer: "Balanced liquid houseplant fertilizer at half-strength"
  schedule: "Once monthly during spring and summer. Hold off entirely in fall and winter."
  active_months: [3, 4, 5, 6, 7, 8]  # March through August

pruning: >
  Trim long, leggy, or sparse vines with clean scissors.
  Cut just below a leaf node to encourage branching and bushier growth.

notes:
  - "Placement: Trailing vines look fantastic cascading from a high shelf or cabinet."
  - "Propagation: One of the easiest plants to propagate. Cut trimmed vines into segments each with one leaf and a node, place in water, and roots appear in a couple of weeks — ready to plant back into the pot."
  - "Photo check (2026-06-15): Trailing beautifully over the cabinet with long, full vines and strong creamy-white-and-green marbling — the high variegation confirms it's getting enough bright, indirect light. There's a cluster of crispy brown dried leaves at the center near the soil; trim these out at the base to tidy it up. A couple of leaf tips show minor browning, which can follow letting it go fully bone-dry — keep watering once the top 50–75% of soil is dry. No signs of pests or reversion to solid green."
  - "Photo check (2026-07-02): Still looking lush and vigorous — long vines cascading well over the cabinet with lots of new growth and bright, well-lit leaves. Most of the plant keeps strong creamy-white-and-green marbling, but a couple of leaves (toward the center) have reverted to full solid-green patches with little to no variegation — an early sign it could use a bit more bright, indirect light to keep producing the snowy-white color. To keep variegation up: nudge it slightly closer to the east window (still filtered, no harsh direct sun), and prune those solid-green reverted vines back to a node so the plant redirects energy into variegated growth. The cluster of crispy brown dried leaves at the center near the soil is still present (a few dead leaves and bare stems by the pot rim) — worth trimming those out at the base to tidy it up. A few leaf tips still show minor browning; keep to the top-50–75%-dry watering rhythm to avoid letting it go bone-dry. No signs of pests. Overall healthy and thriving compared to the June shot, just watch the reversion."
